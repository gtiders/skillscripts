    <text x="278" y="573" class="mono" fill="#dce8f3" font-size="22" font-weight="bold">_displacements</text>
    <text x="69" y="605" class="mono label">PATH</text>
    <text x="172" y="605" class="mono value">~/.config/sks/imports/<tspan fill="#ffd479">ase</tspan>/</text>
    <text x="172" y="630" class="mono value">analyze_<tspan fill="#ffd479">ase</tspan>_displacements.py</text>
