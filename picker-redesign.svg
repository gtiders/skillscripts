    <text x="254" y="217" class="mono amber" font-size="17">ASE</text>
    <text x="287" y="217" class="mono value">-readable structures and trajectories</text>
    <text x="172" y="244" class="mono value">to extended XYZ</text>
    <text x="69" y="288" class="mono label">TAGS</text>
