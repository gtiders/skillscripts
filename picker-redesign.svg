    <text x="122" y="367" class="mono" fill="#dce8f3" font-size="22" font-weight="bold">estimate_</text>
    <rect x="244" y="345" width="45" height="29" rx="5" fill="#67502e"/>
    <text x="246" y="367" class="mono amber" font-size="22" font-weight="bold">ase</text>
    <text x="290" y="367" class="mono" fill="#dce8f3" font-size="22" font-weight="bold">_cutoff</text>
    <text x="69" y="399" class="mono label">PATH</text>
    <text x="172" y="399" class="mono value">~/.config/sks/imports/<tspan fill="#ffd479">ase</tspan>/estimate_<tspan fill="#ffd479">ase</tspan>_cutoff.py</text>
    <text x="69" y="429" class="mono label">COMMAND</text>
    <text x="172" y="429" class="mono value">python {{path}}</text>
