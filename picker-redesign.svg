  <rect x="933" y="28" width="478" height="844" rx="12" fill="#111a25" stroke="#344153"/>
  <text x="953" y="58" class="mono" fill="#dce9f5" font-size="19" font-weight="bold">PREVIEW</text>
  <text x="953" y="88" class="mono cyan" font-size="15">convert_ase_to_extxyz.py</text>
  <line x1="950" y1="103" x2="1394" y2="103" stroke="#344153"/>
  <g clip-path="url(#preview-clip)" class="mono code">
    <text x="952" y="137" class="muted"> 1</text><text x="994" y="137" fill="#8b9aad">#!/usr/bin/env python3</text>
    <text x="952" y="168" class="muted"> 2</text><text x="994" y="168" fill="#a6d38b">"""Convert ASE structures</text>
    <text x="952" y="194" class="muted"> 3</text><text x="994" y="194" fill="#a6d38b">to extended XYZ."""</text>
    <text x="952" y="225" class="muted"> 4</text>
    <text x="952" y="256" class="muted"> 5</text><text x="994" y="256" fill="#c792ea">import</text><text x="1060" y="256" class="body"> argparse</text>
    <text x="952" y="287" class="muted"> 6</text><text x="994" y="287" fill="#c792ea">from</text><text x="1040" y="287" class="body"> pathlib </text><text x="1135" y="287" fill="#c792ea">import</text><text x="1200" y="287" class="body"> Path</text>
    <text x="952" y="318" class="muted"> 7</text><text x="994" y="318" fill="#c792ea">from</text><text x="1040" y="318" class="body"> ase.io </text><text x="1116" y="318" fill="#c792ea">import</text><text x="1180" y="318" class="body"> read, write</text>
    <text x="952" y="349" class="muted"> 8</text>
    <text x="952" y="380" class="muted"> 9</text><text x="994" y="380" fill="#72d8df">def</text><text x="1031" y="380" class="body"> parse_args():</text>
    <text x="952" y="411" class="muted">10</text><text x="1012" y="411" class="body">parser = argparse.</text>
    <text x="1012" y="437" class="body">ArgumentParser()</text>
    <text x="952" y="468" class="muted">11</text><text x="1012" y="468" class="body">parser.add_argument(</text>
    <text x="1030" y="494" fill="#a6d38b">"input"</text><text x="1103" y="494" class="body">, type=Path)</text>
    <text x="952" y="525" class="muted">12</text><text x="1012" y="525" class="body">parser.add_argument(</text>
    <text x="1030" y="551" fill="#a6d38b">"output"</text><text x="1120" y="551" class="body">, type=Path)</text>
    <text x="952" y="582" class="muted">13</text><text x="1012" y="582" fill="#c792ea">return</text><text x="1078" y="582" class="body"> parser.parse_args()</text>
    <text x="952" y="613" class="muted">14</text>
    <text x="952" y="644" class="muted">15</text><text x="994" y="644" fill="#72d8df">def</text><text x="1031" y="644" class="body"> main():</text>
    <text x="952" y="675" class="muted">16</text><text x="1012" y="675" class="body">args = parse_args()</text>
    <text x="952" y="706" class="muted">17</text><text x="1012" y="706" class="body">frames = read(</text>
    <text x="1151" y="706" fill="#a6d38b">str</text><text x="1185" y="706" class="body">(args.input),</text>
    <text x="952" y="737" class="muted">18</text><text x="1030" y="737" fill="#a6d38b">index="":"</text><text x="1125" y="737" class="body">)</text>
    <text x="952" y="768" class="muted">19</text><text x="1012" y="768" class="body">write(args.output, frames,</text>
    <text x="952" y="799" class="muted">20</text><text x="1030" y="799" fill="#a6d38b">format="extxyz"</text><text x="1178" y="799" class="body">)</text>
  </g>
